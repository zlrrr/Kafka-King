name: Build Multi-Platform Binaries

on:
  push:
    branches:
      - claude/kafka-idempotence-compatibility-*
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows Binary
        run: |
          cd app
          wails build -platform windows/amd64 -clean
        shell: bash

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafka-king-windows-amd64
          path: app/build/bin/kafka-king.exe
          retention-days: 30

  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS Binary
        run: |
          cd app
          wails build -platform darwin/universal -clean

      - name: Create macOS Archive
        run: |
          cd app/build/bin
          zip -r kafka-king-macos-universal.zip kafka-king.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafka-king-macos-universal
          path: app/build/bin/kafka-king-macos-universal.zip
          retention-days: 30

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux Binary
        run: |
          cd app
          wails build -platform linux/amd64 -clean

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafka-king-linux-amd64
          path: app/build/bin/kafka-king
          retention-days: 30

  create-release:
    name: Create Release Summary
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/kafka-idempotence-compatibility-')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure
        run: ls -R ./artifacts

      - name: Generate build summary
        run: |
          echo "# 构建成功 ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 构建产物" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows (amd64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS (universal)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux (amd64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 文件大小" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -h artifacts/*/* >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
